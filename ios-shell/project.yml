name: Wanderpass
options:
  bundleIdPrefix: me.wanderpass
  deploymentTarget:
    iOS: "IPHONEOS_DEPLOYMENT_TARGET_PLACEHOLDER"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: me.wanderpass.hub
    PRODUCT_NAME: Wanderpass
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "IPHONEOS_DEPLOYMENT_TARGET_PLACEHOLDER"
    SDKROOT: iphoneos
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    SUPPORTS_MACCATALYST: "NO"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_CFBundleDisplayName: HQ
    INFOPLIST_KEY_LSRequiresIPhoneOS: "YES"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    INFOPLIST_KEY_UIRequiresFullScreen: "YES"
    INFOPLIST_KEY_UIStatusBarHidden: "NO"
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
    INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: "YES"
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Wanderpass:
    type: application
    platform: iOS
    sources:
      - path: Wanderpass
        excludes:
          - "**/.DS_Store"
          - "Web/**"
    resources:
      - path: Wanderpass/Web
        type: folder
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.wanderpass.hub
        PRODUCT_NAME: Wanderpass
        IPHONEOS_DEPLOYMENT_TARGET: "IPHONEOS_DEPLOYMENT_TARGET_PLACEHOLDER"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Wanderpass/Info.plist
      properties:
        CFBundleDisplayName: HQ
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: false
        UIStatusBarStyle: UIStatusBarStyleDefault
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIDeviceFamily:
          - 1
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - me.wanderpass.hub.notify-refresh
        CFBundleURLTypes:
          - CFBundleURLName: me.wanderpass.hub
            CFBundleURLSchemes:
              - app
            CFBundleTypeRole: Editor
