<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HQ</title>
  <meta name="description" content="Robert's private hub: dashboard, world news and travel." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HQ" />
  <meta name="application-name" content="HQ" />
  <meta name="format-detection" content="telephone=no" />
  <meta property="og:title" content="HQ" />
  <meta property="og:description" content="Private hub." />
  <meta property="og:type" content="website" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    :root { --boot-bg: #f2f2f7; --boot-ink: #1c1c1e; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root:not(.light) { --boot-bg: #000000; --boot-ink: #ffffff; } }
    :root.dark { --boot-bg: #000000; --boot-ink: #ffffff; }
    :root.light { --boot-bg: #f2f2f7; --boot-ink: #1c1c1e; }
    html, body, #root { background-color: var(--boot-bg); color: var(--boot-ink); }
    #root { min-height: 100vh; min-height: 100dvh; }
    #pwa-boot { position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; gap: 24px; align-items: center; justify-content: center; background: var(--boot-bg); transition: opacity .28s ease; }
    #pwa-boot img { width: 56px; height: 56px; border-radius: 22%; animation: pwabreathe 2.4s ease-in-out infinite; }
    #pwa-boot .ring { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--boot-ink) 15%, transparent); border-top-color: var(--boot-ink); animation: pwaspin .9s linear infinite; }
    @keyframes pwaspin { to { transform: rotate(360deg); } }
    @keyframes pwabreathe { 50% { transform: scale(.94); opacity: .65; } }
    @media (prefers-reduced-motion: reduce) { #pwa-boot, #pwa-boot img, #pwa-boot .ring { animation: none; transition: none; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="pwa-boot" aria-hidden="true"><img src="/icons/hq-logo.png" alt="" /><div class="ring"></div></div>
  <script>
    (function () {
      var hide = function () {
        var root = document.getElementById('root'), boot = document.getElementById('pwa-boot');
        if (!boot) return;
        if (root && root.children.length > 0) { boot.style.opacity = '0'; setTimeout(function () { boot.remove(); }, 380); }
        else setTimeout(hide, 100);
      };
      window.addEventListener('load', hide);
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
