<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HQ</title>
  <meta name="description" content="Robert's private hub: dashboard, world news and travel." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#07080a" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HQ" />
  <meta name="application-name" content="HQ" />
  <meta name="format-detection" content="telephone=no" />
  <meta property="og:title" content="HQ" />
  <meta property="og:description" content="Private hub." />
  <meta property="og:type" content="website" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <style>
    html, body { background-color: #07080a; color: #ffffff; }
    #root { min-height: 100vh; background-color: #07080a; }
    #pwa-boot { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; background: #07080a; transition: opacity .35s ease; }
    #pwa-boot .ring { width: 48px; height: 48px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.12); border-top-color: rgba(125,211,252,0.9); animation: pwaspin 0.9s linear infinite; }
    @keyframes pwaspin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="pwa-boot" aria-hidden="true"><div class="ring"></div></div>
  <script>
    (function () {
      var hide = function () {
        var root = document.getElementById('root'), boot = document.getElementById('pwa-boot');
        if (!boot) return;
        if (root && root.children.length > 0) { boot.style.opacity = '0'; setTimeout(function () { boot.remove(); }, 380); }
        else setTimeout(hide, 100);
      };
      window.addEventListener('load', hide);
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
